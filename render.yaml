services:
  - type: web
    runtime: node
    name: since-space
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: since-space-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SS_DATA_PATH
        value: /var/data/since-space.json
      - key: SS_ADMIN_PASSWORD
        sync: false
