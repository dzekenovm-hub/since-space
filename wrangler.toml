name = "since-space"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-16"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "since-space-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
